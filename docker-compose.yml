services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    restart: unless-stopped
