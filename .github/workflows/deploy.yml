name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /home/runner/sanders-portfolio

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          docker compose down
          docker compose build
          docker compose up -d